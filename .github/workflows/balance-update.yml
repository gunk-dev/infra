name: Update Balance

on:
  repository_dispatch:
    types: [balance-staging]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: automation
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          inputs: balance
          pr-title: "deploy: update balance"
          pr-labels: |
            dependencies
            automated
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
